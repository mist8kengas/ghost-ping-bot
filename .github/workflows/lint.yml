name: Lint
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v1
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        uses: wearerequired/lint-action@v2.3.0
        with:
          eslint: false
          prettier: true
          auto_fix: false
          commit: false
          git_name: "Linter"
          commit_message: "${linter}: Auto-fix issues"
